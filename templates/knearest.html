<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ experiment.title }} | The Math Behind AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:opsz,wght@9..144,400;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
</head>
<body>
    <div class="bg-shape bg-shape-a"></div>
    <div class="bg-shape bg-shape-b"></div>

    <main class="experiment-shell">
        <a class="back-link" href="{{ url_for('experiments.home') }}">← Back to chapter list</a>

        <section class="experiment-card">
            <p class="eyebrow">{{ experiment.chapter_title }}</p>
            <h1>{{ experiment.title }}</h1>
            <p class="hero-subtitle">
                Tune k, dataset noise, and number of samples. Then classify fresh query points and inspect how the decision boundary bends around the data.
            </p>

            <div class="lab-grid">
                <aside class="controls-panel">
                    <h2>Controls</h2>

                    <label for="k">k neighbors: <span id="k-value">5</span></label>
                    <input id="k" type="range" min="1" max="25" step="1" value="5" />

                    <label for="noise">Noise: <span id="noise-value">0.15</span></label>
                    <input id="noise" type="range" min="0.00" max="0.50" step="0.01" value="0.15" />

                    <label for="samples">Training samples: <span id="samples-value">300</span></label>
                    <input id="samples" type="range" min="80" max="900" step="20" value="300" />

                    <label for="query">Points to classify: <span id="query-value">10</span></label>
                    <input id="query" type="range" min="2" max="30" step="1" value="10" />

                    <button id="run-btn" class="run-btn">Run k-NN</button>

                    <div id="summary" class="summary-box">
                        Press <strong>Run k-NN</strong> to classify new points and draw the boundary.
                    </div>
                </aside>

                <div class="plots-panel">
                    <div id="knn-plot" class="plot"></div>
                </div>
            </div>
        </section>
    </main>

    <script>
        const controls = {
            k: document.getElementById("k"),
            noise: document.getElementById("noise"),
            samples: document.getElementById("samples"),
            query: document.getElementById("query"),
            runBtn: document.getElementById("run-btn"),
            summary: document.getElementById("summary"),
            kValue: document.getElementById("k-value"),
            noiseValue: document.getElementById("noise-value"),
            samplesValue: document.getElementById("samples-value"),
            queryValue: document.getElementById("query-value"),
        };

        function syncLabels() {
            controls.kValue.textContent = controls.k.value;
            controls.noiseValue.textContent = Number(controls.noise.value).toFixed(2);
            controls.samplesValue.textContent = controls.samples.value;
            controls.queryValue.textContent = controls.query.value;
        }

        function splitByLabel(x, y, labels, targetLabel) {
            const xs = [];
            const ys = [];

            labels.forEach((label, i) => {
                if (label === targetLabel) {
                    xs.push(x[i]);
                    ys.push(y[i]);
                }
            });

            return { x: xs, y: ys };
        }

        function renderKnnPlot(data) {
            const train0 = splitByLabel(data.train.x, data.train.y, data.train.labels, 0);
            const train1 = splitByLabel(data.train.x, data.train.y, data.train.labels, 1);
            const query0 = splitByLabel(data.query.x, data.query.y, data.query.pred_labels, 0);
            const query1 = splitByLabel(data.query.x, data.query.y, data.query.pred_labels, 1);

            const boundaryTrace = {
                type: "contour",
                x: data.boundary.x,
                y: data.boundary.y,
                z: data.boundary.z,
                contours: {
                    start: 0,
                    end: 1,
                    size: 1,
                    coloring: "fill",
                },
                colorscale: [
                    [0.0, "rgba(33, 150, 243, 0.25)"],
                    [0.499, "rgba(33, 150, 243, 0.25)"],
                    [0.5, "rgba(244, 67, 54, 0.25)"],
                    [1.0, "rgba(244, 67, 54, 0.25)"],
                ],
                showscale: false,
                hoverinfo: "skip",
            };

            const traces = [
                boundaryTrace,
                {
                    type: "scatter",
                    mode: "markers",
                    x: train0.x,
                    y: train0.y,
                    name: "Train class 0",
                    marker: { color: "#1976d2", size: 7, opacity: 0.72 },
                },
                {
                    type: "scatter",
                    mode: "markers",
                    x: train1.x,
                    y: train1.y,
                    name: "Train class 1",
                    marker: { color: "#d32f2f", size: 7, opacity: 0.72 },
                },
                {
                    type: "scatter",
                    mode: "markers",
                    x: query0.x,
                    y: query0.y,
                    name: "Query predicted 0",
                    marker: { color: "#0d47a1", size: 13, symbol: "x", line: { color: "#111", width: 1 } },
                },
                {
                    type: "scatter",
                    mode: "markers",
                    x: query1.x,
                    y: query1.y,
                    name: "Query predicted 1",
                    marker: { color: "#b71c1c", size: 13, symbol: "x", line: { color: "#111", width: 1 } },
                }
            ];

            Plotly.react("knn-plot", traces, {
                title: `k-NN Decision Boundary (k=${data.params.k})`,
                paper_bgcolor: "rgba(255,255,255,0.72)",
                plot_bgcolor: "rgba(255,255,255,0.88)",
                margin: { l: 45, r: 20, t: 45, b: 40 },
                xaxis: { title: "Feature 1" },
                yaxis: { title: "Feature 2", scaleanchor: "x", scaleratio: 1 },
                legend: { orientation: "h" },
            }, { responsive: true });
        }

        async function runSimulation() {
            controls.runBtn.disabled = true;
            controls.runBtn.textContent = "Running...";

            try {
                const payload = {
                    k: Number(controls.k.value),
                    noise: Number(controls.noise.value),
                    n_samples: Number(controls.samples.value),
                    n_query: Number(controls.query.value),
                };

                const response = await fetch("/api/knearest/run", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });

                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Failed to run k-NN simulation.");
                }

                renderKnnPlot(data);
                controls.summary.innerHTML = `
                    <strong>k:</strong> ${data.params.k}<br>
                    <strong>Noise:</strong> ${data.params.noise.toFixed(2)}<br>
                    <strong>Training samples:</strong> ${data.params.n_samples}<br>
                    <strong>Classified points:</strong> ${data.summary.correct}/${data.summary.total}<br>
                    <strong>Query accuracy:</strong> ${(data.summary.query_accuracy * 100).toFixed(2)}%
                `;
            } catch (error) {
                controls.summary.textContent = `Error: ${error.message}`;
            } finally {
                controls.runBtn.disabled = false;
                controls.runBtn.textContent = "Run k-NN";
            }
        }

        [controls.k, controls.noise, controls.samples, controls.query].forEach((el) => {
            el.addEventListener("input", syncLabels);
        });

        controls.runBtn.addEventListener("click", runSimulation);

        syncLabels();
        runSimulation();
    </script>
</body>
</html>
